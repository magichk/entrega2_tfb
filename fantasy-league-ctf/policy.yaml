apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-runasuser
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - Pod
      validate:
        message: "Los contenedores no deben ejecutarse como root (runAsUser 0)."
        pattern:
          spec:
            =(template):
              spec:
                containers:
                  - securityContext:
                      runAsUser: "!0"
            =(containers):
              - securityContext:
                  runAsUser: "!0"
