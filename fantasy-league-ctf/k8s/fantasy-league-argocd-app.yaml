apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fantasy-league
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://coderepo-lab.magichk.es/jamartin/fantasy-league-ctf.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fantasy-league
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
