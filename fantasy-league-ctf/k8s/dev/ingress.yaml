apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fantasy-league
  namespace: fantasy-league-dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fantasyleague-dev-lab.magichk.es
      secretName: fantasy-league-tls
  rules:
    - host: fantasyleague-dev-lab.magichk.es
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fantasy-league
                port:
                  number: 80
